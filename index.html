<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SIP Protocol CDN</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0a0f; color: #e6e6ea;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    main { max-width: 34rem; padding: 2rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; color: #a78bfa; letter-spacing: .02em; }
    p { margin: .4rem 0; color: #9a9aa6; }
    a { color: #8b9cff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .dim { color: #55555f; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>cdn.sip-protocol.org</h1>
    <p>Static asset CDN for the SIP Protocol ecosystem.</p>
    <p>Serves token logos and demo videos. This is not a public file index.</p>
    <p class="dim">&rarr; <a href="https://sip-protocol.org">sip-protocol.org</a></p>
  </main>
</body>
</html>
